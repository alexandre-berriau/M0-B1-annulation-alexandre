server {
    listen 8001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/... est relayé vers le conteneur de l'API : le navigateur ne voit
    # qu'une seule origine, donc aucune configuration CORS n'est nécessaire.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # Application à page unique : toute autre route retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
